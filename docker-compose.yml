services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inngrid
      POSTGRES_USER: inngrid
      POSTGRES_PASSWORD: inngrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inngrid -d inngrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: InnGrid API
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://inngrid:inngrid@db:5432/inngrid
      JWT_SECRET_KEY: local-development-secret-change-before-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      BACKEND_CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
    command: sh -c "alembic upgrade head && python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
