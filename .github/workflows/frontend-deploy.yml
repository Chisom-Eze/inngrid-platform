name: InnGrid Frontend Deployment

permissions:
  id-token: write
  contents: read

env:
  ARTIFACT_NAME: frontend-standalone.tar.gz

on:
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate deployment configuration
        run: |
          test -n "${{ vars.FRONTEND_ARTIFACTS_BUCKET }}"
          test -n "${{ vars.DEPLOY_ENVIRONMENT }}"

      - name: Set Up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Display Node Version
        run: node --version

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Create deployment artifact
        working-directory: frontend
        run: |
          tar -czf ${{ env.ARTIFACT_NAME }} \
            .next/standalone \
            .next/static

      - name: Generate deployment artifact name
        run: |
          echo "DEPLOY_ARTIFACT=frontend-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}.tar.gz" >> $GITHUB_ENV

      - name: Upload deployment artifact
        run: |
          aws s3 cp \
            frontend/${{ env.ARTIFACT_NAME }} \
            s3://${{ vars.FRONTEND_ARTIFACTS_BUCKET }}/${{ env.DEPLOY_ARTIFACT }}

      - name: Deploy frontend via SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets \
              "Key=tag:Project,Values=InnGrid" \
              "Key=tag:Environment,Values=${{ vars.DEPLOY_ENVIRONMENT }}" \
            --parameters \
              commands="/opt/inngrid/scripts/deploy-frontend.sh ${{ env.DEPLOY_ARTIFACT }}" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for deployment 
        run: |
          aws ssm wait command-executed \
            --command-id ${{ env.COMMAND_ID }} \
            --instance-id $(aws ec2 describe-instances \
              --filters \
                "Name=tag:Project,Values=InnGrid" \
                "Name=tag:Environment,Values=${{ vars.DEPLOY_ENVIRONMENT }}" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)

      - name: Verify frontend 
        run: |
          for i in {1..10}; do
          if curl --fail https://app.chisomeze.online; then
            exit 0
          fi
          
          echo "Waiting for frontend..."


          sleep 10
          done


          exit 1
          