name: InnGrid Staging Deployment

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - develop
      
    paths:
      - 'backend/**'
      - '.github/workflows/staging-deploy.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t inngrid-dev-backend:v1.0.0 \
            ./backend

      - name: Tag Docker Image
        run: |
          docker tag \
          inngrid-dev-backend:v1.0.0 \
          625444834398.dkr.ecr.us-east-1.amazonaws.com/inngrid-dev-backend:v1.0.0

      - name: Push Docker Image
        run: |
          docker push \
          625444834398.dkr.ecr.us-east-1.amazonaws.com/inngrid-dev-backend:v1.0.0

      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster inngrid-dev-cluster \
            --service inngrid-dev-backend \
            --force-new-deployment