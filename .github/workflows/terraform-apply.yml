name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    env:
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_VAR_project_name: ${{ vars.TF_VAR_project_name }}
      TF_VAR_environment: ${{ vars.TF_VAR_environment }}
      TF_VAR_tags: ${{ vars.TF_VAR_tags }}

      TF_VAR_vpc_cidr: ${{ vars.TF_VAR_vpc_cidr }}
      TF_VAR_public_subnet_a_cidr: ${{ vars.TF_VAR_public_subnet_a_cidr }}
      TF_VAR_public_subnet_b_cidr: ${{ vars.TF_VAR_public_subnet_b_cidr }}
      TF_VAR_private_subnet_a_cidr: ${{ vars.TF_VAR_private_subnet_a_cidr }}
      TF_VAR_private_subnet_b_cidr: ${{ vars.TF_VAR_private_subnet_b_cidr }}

      TF_VAR_domain_name: ${{ vars.TF_VAR_domain_name }}
      TF_VAR_subdomain_name: ${{ vars.TF_VAR_subdomain_name }}

      TF_VAR_db_name: ${{ vars.TF_VAR_db_name }}
      TF_VAR_db_username: ${{ vars.TF_VAR_db_username }}

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false